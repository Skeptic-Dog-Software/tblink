[package]
name = "tblink"
version = "0.1.0"
edition = "2021"
description = "Keep a two-Mac Thunderbolt RDMA link and its oMLX cluster deployment up across cable moves and reboots"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
strip = true
